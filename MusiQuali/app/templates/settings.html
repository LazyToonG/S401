<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musiquali - Paramètres</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='style_admin.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='style_requete.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='message_alert.css') }}" rel="stylesheet">
    <style>
        .settings-container {
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            color: #333;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #b3c6d6;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .settings-section {
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 25px;
        }
        .settings-section:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .settings-title {
            font-size: 18px;
            color: #651b1b;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }
    </style>
</head>
<body>
    {% include 'nav_bar.html' %}

    <main class="content-area">
        <div class="settings-container">
            <h2 style="margin-bottom: 25px; border-bottom: 2px solid #651b1b; padding-bottom: 10px;">{{t.settings}}</h2>

            <form action="/settings" method="POST">
                
                <div class="settings-section">
                    <div class="settings-title">{{t.langue}}</div>
                    <div class="role-options" style="display: flex; gap: 15px;">
                        <label class="radio-label" style="flex: 1; text-align: center; cursor: pointer;">
                            <input type="radio" name="language" value="fr" {% if current_lang == 'fr' %}checked{% endif %}>
                            <span class="radio-btn" style="display: flex; align-items: center; justify-content: center; gap: 8px;"><img src="{{ url_for('static', filename='img/icFR.png') }}" alt="Français" class="langue-img" style="height: auto; width: 20px;">Français</span>
                        </label>
                        <label class="radio-label" style="flex: 1; text-align: center; cursor: pointer;">
                            <input type="radio" name="language" value="en" {% if current_lang == 'en' %}checked{% endif %}>
                            <span class="radio-btn" style="display: flex; align-items: center; justify-content: center; gap: 8px;"><img src="{{ url_for('static', filename='img/icUK.png') }}" alt="UK" class="langue-img" style="height: auto; width: 20px;">English</span>
                        </label>
                    </div>
                </div>

                <div class="settings-section">
                    <div class="settings-title">{{t.affichage}}</div>
                    <div class="toggle-container">
                        <span>{{t.mode}}</span>
                        <label class="radio-label" style="width: auto;">
                            <input type="checkbox" name="dark_mode" id="dark-mode-toggle" onchange="toggleQuickDarkMode()" style="transform: scale(1.3); cursor: pointer;">
                        </label>
                    </div>
                </div>

                <div style="text-align: right; margin-top: 20px;">
                    <button type="submit" class="tab-btn active" style="border-radius: 8px; background-color: #a71e23;">{{t.enregistrer}}</button>
                </div>
                
            </form>
        </div>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
