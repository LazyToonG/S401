<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Mot de passe oublié - Musiquali</title>
    <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}" type="image/png">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='style_accueil.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='message_alert.css') }}" rel="stylesheet">
</head>
<body style="background-color: #f9f9f9;">

    <div class="nav">
        <div class="logo"><img src="{{ url_for('static', filename='img/logo.png') }}" alt="logo"/><p>Musi-quali</p></div>
        <div class="b">
            <div class="page" id="signin" onclick="window.location.href='{{ url_for('signin') }}';">S'inscrire</div>
            <div class="page" id="index" onclick="window.location.href='{{ url_for('index') }}';">Retour à l'accueil</div>
        </div>
    </div>
    {% include 'messages_alert.html' %}

    <div style="display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 20px;">
        <div style="background-color: #ffffff; width: 100%; max-width: 450px; padding: 40px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);">
            
            <h2 style="color: #651b1b; text-align: center; margin-bottom: 15px; font-weight: normal; font-size: 26px;">Mot de passe oublié ?</h2>
            <p style="text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; line-height: 1.5;">
                Entrez l'adresse e-mail associée à votre compte. Nous vous enverrons un lien pour réinitialiser votre mot de passe.
            </p>

            <form action="/forgot_password" method="POST">
                <div style="margin-bottom: 25px;">
                    <label for="email" style="display: block; font-size: 14px; margin-bottom: 8px; color: #651b1b;">Adresse E-mail</label>
                    <input type="email" id="email" name="email" required style="width: 100%; padding: 12px; border: 1px solid #5d1b1b5a; border-radius: 6px; font-size: 14px; outline: none; box-sizing: border-box;">
                </div>
                
                <button type="submit" style="width: 100%; background-color: #CE5956; color: white; border: none; padding: 14px; font-size: 16px; border-radius: 25px; cursor: pointer; transition: 0.3s;">
                    Envoyer le lien
                </button>
            </form>
            
            <div style="text-align: center; margin-top: 20px;">
                <a href="{{ url_for('login') }}" style="color: #651b1b; text-decoration: none; font-size: 14px;">Retour à la connexion</a>
            </div>

        </div>
    </div>

    <script src="{{ url_for('static', filename='message_alert.js') }}"></script>
</body>
</html>
