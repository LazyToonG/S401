<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weekly Calendar (Drag and Drop)</title>
    <style>
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: #fff;
            border-radius: 8px;
            width: 360px;
            max-width: 90%;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid #ddd;
        }
        .modal-header h2 {
            margin: 0;
            font-size: 1.1em;
        }
        .modal-close-btn {
            background: none;
            border: none;
            font-size: 1.4em;
            line-height: 1;
            cursor: pointer;
            color: #555;
        }
        .modal-close-btn:hover {
            color: #000;
        }
        .modal-list {
            list-style: none;
            margin: 0;
            padding: 0;
            overflow-y: auto;
        }
        .modal-list li {
            padding: 10px 16px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        .modal-list li:hover {
            background: #f2f2f2;
        }
        .modal-empty {
            color: #888;
            cursor: default !important;
        }
        .modal-empty:hover {
            background: none !important;
        }
        .commercial-box .time-input {
            margin-top: 4px;
            font-size: 0.85em;
            cursor: default;
        }
        .message-calendar-box .time-input {
            margin-top: 4px;
            font-size: 0.85em;
            cursor: default;
        }

        /* --- Styles pour l'onglet "Enregistrement de messages" (équivalent minimal de marketing.html) --- */
        .upload-area {
            display: block;
            border: 2px dashed #999;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            color: #555;
            background-color: #fafafa;
            margin-bottom: 15px;
        }
        .upload-area:hover {
            background-color: #f0f0f0;
        }
        .file-preview-container {
            margin-bottom: 15px;
        }
        .file-preview-container.hidden {
            display: none;
        }
        .file-preview-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border: 1px solid #eee;
            border-radius: 6px;
            margin-bottom: 6px;
            background: #fff;
        }
        .file-preview-item .item-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .remove-file-btn {
            cursor: pointer;
            color: #c0392b;
            font-weight: bold;
            margin-left: 10px;
        }
        .upload-actions {
            display: flex;
            gap: 10px;
        }
        .btn-action-blue {
            background-color: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 0.95em;
        }
        .btn-action-blue:disabled {
            background-color: #9ab4ea;
            cursor: not-allowed;
        }
        .btn-action-blue.full-width {
            flex: 1;
        }
        .messages-list-container {
            margin-top: 25px;
        }
        .message-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eaeaea;
        }
        .message-box .item-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .message-box .item-info b {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .message-box .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #c0392b;
        }
    </style>
</head>
<body>


    <select id="tabSelect" onchange="switchTab()">
        <option value="tab1">Gestion des commerciaux</option>
        <option value="tab2">Gestion des messages</option>
        <option value="tab3">Enregistrement de messages</option>
    </select>

    <button id="save-planning-btn" style="margin-left: 10px;">💾 Save</button>
    <span id="save-status" style="margin-left: 10px; color: #555;"></span>

<div id="tab1" class="tab-content">
    <h1>Calendrier des commerciaux</h1>
    
    <button id="add-box-btn">+ add commercial</button>
   
    <br>

    <!-- Modal de sélection de commercial -->
    <div id="commercial-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h2>Choisir un commercial</h2>

    <table border="1" cellpadding="10" cellspacing="0" width="100%">
        <thead>
            <tr bgcolor="#f2f2f2">
                <th width="14.28%">Monday</th>
                <th width="14.28%">Tuesday</th>
                <th width="14.28%">Wednesday</th>
                <th width="14.28%">Thursday</th>
                <th width="14.28%">Friday</th>

                <td class="messageszone" id="thu-tab2"></td>

<div id="tab3" class="tab-content">

    <form action="/upload" method="POST" enctype="multipart/form-data" id="upload-form-message">

    <script>//crée des boites pour faire bouger les commerciaux

        // #TODO
        // automatiquement créer des boites selon ce qu'il y a dans la bd (planning existant au chargement).
        // gérer l'heure de start/fin de chaque créneau.


        // compteur de boites
        let boxCounter = 0;

        // ne peut etre laché que dans les zone désignés c-a-d les jours
        const addBoxBtn = document.getElementById('add-box-btn');
        const dropzones = document.querySelectorAll('.dropzone');

        // -------------------- modal de sélection de commercial
        const commercialModal = document.getElementById('commercial-modal');
        const commercialModalList = document.getElementById('commercial-modal-list');
        const commercialModalClose = document.getElementById('commercial-modal-close');

        function openCommercialModal() {
            commercialModal.classList.add('open');
            loadCommerciauxIntoModal();
        }

        function closeCommercialModal() {
            commercialModal.classList.remove('open');
        }

        commercialModalClose.addEventListener('click', closeCommercialModal);
        // fermer si on clique en dehors de la boite
        commercialModal.addEventListener('click', (e) => {
            if (e.target === commercialModal) {
                closeCommercialModal();
            }
        });

        async function loadCommerciauxIntoModal() {
            commercialModalList.innerHTML = '<li class="modal-empty">Chargement...</li>';

            try {
                const response = await fetch('/marketing/playlists');
                if (!response.ok) {
                    throw new Error('Erreur lors du chargement des commerciaux');
                }
                const commerciaux = await response.json();

                if (!commerciaux.length) {
                    commercialModalList.innerHTML = '<li class="modal-empty">Aucun commercial disponible</li>';
                    return;
                }

                commercialModalList.innerHTML = '';
                commerciaux.forEach(commercial => {
                    const item = document.createElement('li');
                    item.textContent = commercial.title;
                    item.addEventListener('click', () => {
                        createCommercialBox(commercial);
                        closeCommercialModal();
                    });
                    commercialModalList.appendChild(item);
                });
            } catch (err) {
                commercialModalList.innerHTML = '<li class="modal-empty">Erreur de chargement</li>';
                console.error(err);
            }
        }

        // -------------------- logique des boites
        function sortColumnByTime(column) {
            const boxes = Array.from(column.children).filter(el => el.classList.contains('commercial-box'));
            boxes.sort((a, b) => {
                const timeA = a.dataset.time || '99:99';
                const timeB = b.dataset.time || '99:99';
                return timeA.localeCompare(timeB);
            });
            boxes.forEach(box => column.appendChild(box));
        }

        function createCommercialBox(commercial, options = {}) {
            boxCounter++;

            const { idPlanning = null, time = '', dayId = 'mon-tab1' } = options;

            // create box
            const newBox = document.createElement('div');
            newBox.id = `box-${boxCounter}`;
            newBox.className = 'commercial-box';
            newBox.draggable = true;
            newBox.dataset.idPlaylist = commercial.idPlaylist;
            newBox.dataset.idPlanning = idPlanning !== null ? idPlanning : '';
            newBox.dataset.time = time;

            // nom des boites = titre du commercial choisi + sélecteur d'heure
            newBox.innerHTML = `
                <b>${commercial.title}</b><br>
                <small>Drag me</small><br>
                <input type="time" class="time-input" value="${time}">
            `;

            // Using basic JS inline styles *only* to simulate basic HTML box borders/padding 
            // so you can actually see and grab the empty boxes.
            newBox.style.border = "2px dashed #333";
            newBox.style.padding = "10px";
            newBox.style.margin = "5px 0";
            newBox.style.backgroundColor = "#e0e0e0";
            newBox.style.cursor = "move";

            // Met à jour l'heure stockée et re-trie la colonne quand on change le champ
            const timeInput = newBox.querySelector('.time-input');
            timeInput.addEventListener('mousedown', (e) => {
                e.stopPropagation();
            });
            timeInput.addEventListener('click', (e) => {
                // empêche le drag de partir quand on clique dans le champ
                e.stopPropagation();
            });
            timeInput.addEventListener('change', (e) => {
                newBox.dataset.time = e.target.value;
                sortColumnByTime(newBox.parentElement);
            });

            // Attach drag start event to the new box
            newBox.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', e.target.id);
            });

            // Place la boite dans la bonne colonne (Monday par défaut pour une nouvelle boite)
            document.getElementById(dayId).appendChild(newBox);
            return newBox;
        }

        addBoxBtn.addEventListener('click', () => {
            openCommercialModal();
        });

        // --- DragonDrop
        dropzones.forEach(zone => {
            // Necessary to allow dropping (default behavior prevents it)
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
            });

            // Handle the drop event
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                const boxId = e.dataTransfer.getData('text/plain');
                const draggedBox = document.getElementById(boxId);
                
                // Ensure we are appending to the column (TD), not inside another box
                let targetColumn;
                if (e.target.classList.contains('dropzone')) {
                    targetColumn = e.target;
                } else {
                    // If dropped onto an existing box, append to its parent column instead
                    targetColumn = e.target.closest('.dropzone');
                }
                targetColumn.appendChild(draggedBox);
                sortColumnByTime(targetColumn);
            });
        });


    
        //pour le 2e tab : calendrier des messages (même fonctionnement que l'onglet 1)

        let MessageCounter = 0;

        // ne peut etre laché que dans les zone désignés c-a-d les jours
        const messageBoxBtn = document.getElementById('add-message-btn');
        const messageszones = document.querySelectorAll('.messageszone');

        // -------------------- modal de sélection de message
        const messageModal = document.getElementById('message-modal');
        const messageModalList = document.getElementById('message-modal-list');
        const messageModalClose = document.getElementById('message-modal-close');

        function openMessageModal() {
            messageModal.classList.add('open');
            loadMessagesIntoModal();
        }

        function closeMessageModal() {
            messageModal.classList.remove('open');
        }

        messageModalClose.addEventListener('click', closeMessageModal);
        // fermer si on clique en dehors de la boite
        messageModal.addEventListener('click', (e) => {
            if (e.target === messageModal) {
                closeMessageModal();
            }
        });

        async function loadMessagesIntoModal() {
            messageModalList.innerHTML = '<li class="modal-empty">Chargement...</li>';

            try {
                const response = await fetch('/marketing/musiques?prefix=MSG_');
                if (!response.ok) {
                    throw new Error('Erreur lors du chargement des messages');
                }
                const messages = await response.json();

                if (!messages.length) {
                    messageModalList.innerHTML = '<li class="modal-empty">Aucun message disponible</li>';
                    return;
                }

                messageModalList.innerHTML = '';
                messages.forEach(message => {
                    const item = document.createElement('li');
                    item.textContent = message.nomMusique;
                    item.addEventListener('click', () => {
                        createMessageBox(message);
                        closeMessageModal();
                    });
                    messageModalList.appendChild(item);
                });
            } catch (err) {
                messageModalList.innerHTML = '<li class="modal-empty">Erreur de chargement</li>';
                console.error(err);
            }
        }

        // -------------------- logique des boites
        function createMessageBox(message, options = {}) {
            MessageCounter++;

            const { idPlanning = null, time = '', dayId = 'mon-tab2' } = options;

            // create box
            const newBox = document.createElement('div');
            newBox.id = `msgbox-${MessageCounter}`;
            newBox.className = 'message-calendar-box';
            newBox.draggable = true;
            newBox.dataset.idMusique = message.idMusique;
            newBox.dataset.idPlanning = idPlanning !== null ? idPlanning : '';
            newBox.dataset.time = time;

            // nom des boites = titre du message choisi + sélecteur d'heure
            newBox.innerHTML = `
                <b>${message.nomMusique}</b><br>
                <small>Drag me</small><br>
                <input type="time" class="time-input" value="${time}">
            `;

            // Using basic JS inline styles *only* to simulate basic HTML box borders/padding 
            // so you can actually see and grab the empty boxes.
            newBox.style.border = "2px dashed #333";
            newBox.style.padding = "10px";
            newBox.style.margin = "5px 0";
            newBox.style.backgroundColor = "#e0e0e0";
            newBox.style.cursor = "move";

            // Met à jour l'heure stockée et re-trie la colonne quand on change le champ
            const timeInput = newBox.querySelector('.time-input');
            timeInput.addEventListener('mousedown', (e) => {
                e.stopPropagation();
            });
            timeInput.addEventListener('click', (e) => {
                // empêche le drag de partir quand on clique dans le champ
                e.stopPropagation();
            });
            timeInput.addEventListener('change', (e) => {
                newBox.dataset.time = e.target.value;
                sortMessageColumnByTime(newBox.parentElement);
            });

            // Attach drag start event to the new box
            newBox.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', e.target.id);
            });

            // Place la boite dans la bonne colonne (Monday par défaut pour une nouvelle boite)
            document.getElementById(dayId).appendChild(newBox);
            return newBox;
        }

        function sortMessageColumnByTime(column) {
            const boxes = Array.from(column.children).filter(el => el.classList.contains('message-calendar-box'));
            boxes.sort((a, b) => {
                const timeA = a.dataset.time || '99:99';
                const timeB = b.dataset.time || '99:99';
                return timeA.localeCompare(timeB);
            });
            boxes.forEach(box => column.appendChild(box));
        }

        messageBoxBtn.addEventListener('click', () => {
            openMessageModal();
        });

        // --- DragonDrop
        messageszones.forEach(zone => {
            // Necessary to allow dropping (default behavior prevents it)
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
            });

            // Handle the drop event
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                const boxId = e.dataTransfer.getData('text/plain');
                const draggedBox = document.getElementById(boxId);

                // Ensure we are appending to the column (TD), not inside another box
                let targetColumn;
                if (e.target.classList.contains('messageszone')) {
                    targetColumn = e.target;
                } else {
                    // If dropped onto an existing box, append to its parent column instead
                    targetColumn = e.target.closest('.messageszone');
                }
                targetColumn.appendChild(draggedBox);
                sortMessageColumnByTime(targetColumn);
            });
        });


        // -------------------- Sauvegarde / chargement du planning (bd) --------------------

        // Mapping des colonnes vers un offset de jour (0 = lundi de la semaine courante)
        const DAY_OFFSETS = {
            'mon': 0, 'tue': 1, 'wed': 2, 'thu': 3, 'fri': 4, 'sat': 5, 'sun': 6
        };

        // Retourne le lundi de la semaine courante (à minuit, heure locale)
        function getCurrentMonday() {
            const now = new Date();
            const day = now.getDay(); // 0 = dimanche, 1 = lundi, ...
            const diffToMonday = (day === 0) ? -6 : 1 - day;
            const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMonday);
            return monday;
        }

        // Construit un ISO datetime local (YYYY-MM-DDTHH:MM:SS) à partir d'un id de colonne (ex: "mon-tab1") + heure HH:MM
        function buildStartTime(dayId, time) {
            if (!time) return null;
            const dayCode = dayId.split('-')[0]; // "mon", "tue", ...
            const offset = DAY_OFFSETS[dayCode];
            if (offset === undefined) return null;

            const monday = getCurrentMonday();
            const target = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + offset);
            const [hours, minutes] = time.split(':').map(Number);
            target.setHours(hours, minutes, 0, 0);

            const pad = (n) => String(n).padStart(2, '0');
            return `${target.getFullYear()}-${pad(target.getMonth() + 1)}-${pad(target.getDate())}T${pad(target.getHours())}:${pad(target.getMinutes())}:00`;
        }

        // Convertit un StartTime ISO en {dayId, time} pour replacer une boite au chargement
        function startTimeToDayAndTime(startTime, suffix) {
            const dt = new Date(startTime);
            const monday = getCurrentMonday();
            const diffDays = Math.round((new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()) - monday) / 86400000);

            const dayCodes = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
            const dayCode = dayCodes[((diffDays % 7) + 7) % 7]; // sécurité si la date sort de la semaine affichée

            const pad = (n) => String(n).padStart(2, '0');
            const time = `${pad(dt.getHours())}:${pad(dt.getMinutes())}`;

            return { dayId: `${dayCode}-${suffix}`, time };
        }

        const savePlanningBtn = document.getElementById('save-planning-btn');
        const saveStatus = document.getElementById('save-status');

        async function savePlanning() {
            saveStatus.textContent = 'Sauvegarde en cours...';

            const boxes = [];

            // Boites commerciales (tab1)
            document.querySelectorAll('#tab1 .commercial-box').forEach(box => {
                const time = box.dataset.time;
                if (!time) return; // une boite sans heure n'est pas envoyée (incomplète)

                const dayId = box.parentElement.id; // ex: "mon-tab1"
                const startTime = buildStartTime(dayId, time);
                if (!startTime) return;

                boxes.push({
                    idPlanning: box.dataset.idPlanning ? parseInt(box.dataset.idPlanning, 10) : null,
                    idPlaylist: parseInt(box.dataset.idPlaylist, 10),
                    idMSG: null,
                    StartTime: startTime,
                    _box: box // référence locale, retirée avant l'envoi
                });
            });

            // Boites messages (tab2)
            document.querySelectorAll('#tab2 .message-calendar-box').forEach(box => {
                const time = box.dataset.time;
                if (!time) return;

                const dayId = box.parentElement.id; // ex: "mon-tab2"
                const startTime = buildStartTime(dayId, time);
                if (!startTime) return;

                boxes.push({
                    idPlanning: box.dataset.idPlanning ? parseInt(box.dataset.idPlanning, 10) : null,
                    idPlaylist: null,
                    idMSG: parseInt(box.dataset.idMusique, 10),
                    StartTime: startTime,
                    _box: box
                });
            });

            const payloadBoxes = boxes.map(({ _box, ...rest }) => rest);

            try {
                const res = await fetch('/planning/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idEntreprise: 1, boxes: payloadBoxes })
                });

                if (!res.ok) {
                    saveStatus.textContent = 'Erreur lors de la sauvegarde.';
                    console.error('Erreur save', res.status);
                    return;
                }

                const saved = await res.json();

                // Réassigne idPlanning à chaque boite locale (utile pour les nouvelles boites créées)
                saved.forEach((row, i) => {
                    if (boxes[i] && boxes[i]._box) {
                        boxes[i]._box.dataset.idPlanning = row.idPlanning;
                    }
                });

                saveStatus.textContent = 'Sauvegardé ✓';
                setTimeout(() => { saveStatus.textContent = ''; }, 2000);

            } catch (err) {
                saveStatus.textContent = 'Erreur réseau lors de la sauvegarde.';
                console.error(err);
            }
        }

        if (savePlanningBtn) {
            savePlanningBtn.addEventListener('click', savePlanning);
        }

        // Charge le planning existant et reconstruit les deux calendriers
        async function loadPlanning() {
            try {
                const [planningRes, playlistsRes, musiquesRes] = await Promise.all([
                    fetch('/planning/data?idEntreprise=1'),
                    fetch('/marketing/playlists'),
                    fetch('/marketing/musiques?prefix=MSG_')
                ]);

                if (!planningRes.ok) {
                    throw new Error('Erreur lors du chargement du planning');
                }

                const rows = await planningRes.json();
                const playlists = playlistsRes.ok ? await playlistsRes.json() : [];
                const messages = musiquesRes.ok ? await musiquesRes.json() : [];

                const playlistById = new Map(playlists.map(p => [p.idPlaylist, p]));
                const messageById = new Map(messages.map(m => [m.idMusique, m]));

                for (const row of rows) {
                    if (row.idPlaylist !== null && row.idPlaylist !== undefined) {
                        const { dayId, time } = startTimeToDayAndTime(row.StartTime, 'tab1');
                        const playlist = playlistById.get(row.idPlaylist) || { idPlaylist: row.idPlaylist, title: `Playlist #${row.idPlaylist}` };
                        const box = createCommercialBox(
                            playlist,
                            { idPlanning: row.idPlanning, time, dayId }
                        );
                        sortColumnByTime(box.parentElement);
                    } else if (row.idMSG !== null && row.idMSG !== undefined) {
                        const { dayId, time } = startTimeToDayAndTime(row.StartTime, 'tab2');
                        const message = messageById.get(row.idMSG) || { idMusique: row.idMSG, nomMusique: `Message #${row.idMSG}` };
                        const box = createMessageBox(
                            message,
                            { idPlanning: row.idPlanning, time, dayId }
                        );
                        sortMessageColumnByTime(box.parentElement);
                    }
                }
            } catch (err) {
                console.error(err);
            }
        }

        loadPlanning();


        //pour le 3e tab : upload des messages (copié/adapté de marketing.html, préfixe MSG_ ajouté)

        const audioInputMessage = document.getElementById('audio-input-message');
        const filePreviewContainerMessage = document.getElementById('file-preview-container-message');
        const btnUploadMessage = document.getElementById('btn-upload-message');
        const uploadTextMessage = document.getElementById('upload-text-message');
        const messagesList = document.getElementById('messages-list');

        // Objet magique pour manipuler les FileList en JavaScript
        let selectedMessageFilesTransfer = new DataTransfer();

        // Ajoute le préfixe MSG_ au nom d'un fichier (sans le dupliquer si déjà présent)
        function withMsgPrefix(file) {
            const alreadyPrefixed = file.name.startsWith('MSG_');
            const newName = alreadyPrefixed ? file.name : `MSG_${file.name}`;
            return new File([file], newName, { type: file.type });
        }

        if (audioInputMessage) {
            audioInputMessage.addEventListener('change', function() {
                // Ajoute les nouveaux fichiers sélectionnés (préfixés) à notre liste virtuelle
                for (let i = 0; i < this.files.length; i++) {
                    selectedMessageFilesTransfer.items.add(withMsgPrefix(this.files[i]));
                }
                // Met à jour le vrai input pour l'envoi Flask
                this.files = selectedMessageFilesTransfer.files;
                updateMessageFilePreview();
            });
        }

        function updateMessageFilePreview() {
            filePreviewContainerMessage.innerHTML = ''; // On vide l'affichage

            if (selectedMessageFilesTransfer.files.length > 0) {
                filePreviewContainerMessage.classList.remove('hidden');
                btnUploadMessage.disabled = false; // Active le bouton d'envoi
                uploadTextMessage.innerText = "Ajouter d'autres fichiers (.mp3)";

                // Génère le HTML pour chaque fichier
                Array.from(selectedMessageFilesTransfer.files).forEach((file, index) => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-preview-item';

                    const fileName = document.createElement('span');
                    fileName.className = 'item-name';
                    fileName.innerText = file.name;

                    const removeBtn = document.createElement('span');
                    removeBtn.className = 'remove-file-btn';
                    removeBtn.innerHTML = '&times;';

                    removeBtn.addEventListener('click', function(e) {
                        e.preventDefault(); // Évite d'ouvrir l'explorateur de fichiers
                        removeMessageFile(index);
                    });

                    fileItem.appendChild(fileName);
                    fileItem.appendChild(removeBtn);
                    filePreviewContainerMessage.appendChild(fileItem);
                });
            } else {
                // S'il n'y a plus de fichiers, on cache tout
                filePreviewContainerMessage.classList.add('hidden');
                btnUploadMessage.disabled = true;
                uploadTextMessage.innerText = "Glisser-déposer ou cliquer pour sélectionner un fichier";
            }
        }

        function removeMessageFile(indexToRemove) {
            const newTransfer = new DataTransfer();

            // On recrée la liste en ignorant le fichier supprimé
            Array.from(selectedMessageFilesTransfer.files).forEach((file, index) => {
                if (index !== indexToRemove) {
                    newTransfer.items.add(file);
                }
            });

            selectedMessageFilesTransfer = newTransfer;
            audioInputMessage.files = selectedMessageFilesTransfer.files; // Met à jour le vrai input
            updateMessageFilePreview(); // Rafraîchit l'affichage
        }

        // --- Création d'une boite de message dans la liste (réutilisée au chargement et après upload) ---
        function createMessageListBox(m) {
            const box = document.createElement('div');
            box.id = `message-box-${m.idMusique}`;
            box.className = 'message-box';
            box.dataset.musicId = m.idMusique;
            box.innerHTML = `
                <span class="item-info">
                    <b>${m.nomMusique}</b>
                    <span style="white-space: nowrap;">— ${m.duree}s</span>
                </span>
                <form action="/marketing/music/${m.idMusique}/delete" method="POST" style="margin: 0;">
                    <button type="submit" class="action-btn">&times;</button>
                </form>
            `;

            box.querySelector('form').addEventListener('submit', async (ev) => {
                ev.preventDefault();
                const f = ev.target;
                const b = f.closest('.message-box');
                try {
                    const r = await fetch(f.action, {
                        method: 'POST',
                        headers: { 'X-Requested-With': 'XMLHttpRequest' }
                    });
                    if (r.ok) {
                        b.remove();
                    } else {
                        console.error('Erreur lors de la suppression', r.status);
                    }
                } catch (err) {
                    console.error('Erreur réseau lors de la suppression', err);
                }
            });

            messagesList.appendChild(box);
        }

        // --- Charge les messages déjà en bd au chargement de la page (même méthode que marketing.html) ---
        async function loadExistingMessages() {
            try {
                const response = await fetch('/marketing/musiques?prefix=MSG_');
                if (!response.ok) {
                    throw new Error('Erreur lors du chargement des messages existants');
                }
                const messages = await response.json();
                messages.forEach(m => createMessageListBox(m));
            } catch (err) {
                console.error(err);
            }
        }

        if (messagesList) {
            loadExistingMessages();
        }

        // --- UPLOAD EN AJAX (pas de rechargement de page) ---
        const uploadFormMessage = document.getElementById('upload-form-message');

        if (uploadFormMessage) {
            uploadFormMessage.addEventListener('submit', async (e) => {
                e.preventDefault();

                const formData = new FormData(uploadFormMessage);

                try {
                    const res = await fetch(uploadFormMessage.action, {
                        method: 'POST',
                        headers: { 'X-Requested-With': 'XMLHttpRequest' },
                        body: formData
                    });

                    if (!res.ok) {
                        console.error('Erreur lors de l\'upload', res.status);
                        return;
                    }

                    const data = await res.json();

                    (data.musiques || []).forEach(m => createMessageListBox(m));

                    // Réinitialise le formulaire et la prévisualisation
                    selectedMessageFilesTransfer = new DataTransfer();
                    audioInputMessage.value = '';
                    updateMessageFilePreview();

                } catch (err) {
                    console.error('Erreur réseau lors de l\'upload', err);
                }
            });
        }


        function switchTab() { // handle the tabs.
            // choper val du dropdown
            const selectedValue = document.getElementById("tabSelect").value;
            
            // grab the right 'tab-content'
            const tabs = document.getElementsByClassName("tab-content");
           
            // montrer le bon, cacher le reste
            for (let i = 0; i < tabs.length; i++) {
                if (tabs[i].id === selectedValue) {
                    tabs[i].style.display = "block";  // Show
                } else {
                    tabs[i].style.display = "none";   // Hide
                }
            }
        }


        switchTab();
    </script>

</body>
</html>
