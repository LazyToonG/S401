<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musiquali - Envoyer une requête</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='message_alert.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='style_requete.css') }}" rel="stylesheet">
</head>
<body>

    {% include 'nav_bar.html' %}

    <main class="main-container">
        
        <div class="request-card">
            <h1 class="title">Envoyer une requête à<br>l'administrateur</h1>
            
            <form action="{{ url_for('submit_requete') }}" method="POST">
                
                <div class="input-group">
                    <label class="group-label">Type de requête</label>
                    <div class="radio-options">
                        <label class="radio-label">
                            <input type="radio" name="request_type" value="Changement de rôle" required>
                            <span class="radio-btn">Changement de rôle</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="request_type" value="Modification de l'e-mail">
                            <span class="radio-btn">Modification de l'e-mail</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="request_type" value="Autre">
                            <span class="radio-btn">Autre</span>
                        </label>
                    </div>
                </div>
                
                <div class="input-group" id="champ-description">
                    <label class="group-label" for="description">Description</label>
                    <textarea id="description" name="description" rows="4" required></textarea>
                </div>

                <div class="input-group" id="champ-nouveau-role" style="display: none;">
                    <label class="group-label" for="nouveau_role">Choisissez le nouveau rôle demandé :</label>
                    <select id="nouveau_role" name="nouveau_role" style="width: 100%; padding: 12px; border: 1px solid #b5abab; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; background-color: transparent;">
                        <option value="commercial">Commercial</option>
                        <option value="marketing">Marketing</option>
                        <option value="admin">Administrateur</option>
                    </select>
                </div>
                
                <button type="submit" class="submit-btn-requete">Envoyer</button>
                
            </form>
        </div>

    </main>

    <script>
        // --- GESTION DE L'AFFICHAGE CONDITIONNEL DES CHAMPS ---
        const radios = document.querySelectorAll('input[name="request_type"]');
        const champDesc = document.getElementById('champ-description');
        const descTextarea = document.getElementById('description');
        const champRole = document.getElementById('champ-nouveau-role');

        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'Changement de rôle') {
                    // On affiche le menu des rôles et on cache la description
                    champDesc.style.display = 'none';
                    descTextarea.removeAttribute('required'); // Indispensable pour que le formulaire puisse s'envoyer !
                    champRole.style.display = 'block';
                } else {
                    // On remet l'affichage classique
                    champDesc.style.display = 'block';
                    descTextarea.setAttribute('required', 'required');
                    champRole.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
