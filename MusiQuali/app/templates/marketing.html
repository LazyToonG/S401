<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musiquali - Marketing</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='style_marketing.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='message_alert.css') }}" rel="stylesheet">
    <style>
        .music-box {
            border: 2px dashed #651b1b;
            padding: 10px;
            margin: 5px 0;
            background-color: #EBE3E3;
            cursor: move;
            border-radius: 8px;
            color: #000;
        }
    </style>
</head>
<body class="no-scroll"> 
    {% include 'nav_bar.html' %}

    <div class="tabs-container">
        <button class="tab-pill active" data-target="tab-playlists">Playlists</button>
        <button class="tab-pill" data-target="tab-all-music">Toutes les musiques</button>
    </div>

    <main class="marketing-layout">

        <div class="left-panel">

            <div id="tab-playlists" class="panel-view active">
                
                <form action="{{ url_for('add_playlist') }}" method="POST" style="display:flex; gap:8px; margin-bottom:10px;">
                    <input type="text" name="title" placeholder="Nom de la playlist" required>
                    <button type="submit">+ add playlist</button>
                </form>
                {% for p in playlists %}
                <div id="playlist-box-{{ p.idPlaylist }}" draggable="true" data-playlist-id="{{ p.idPlaylist }}" style="display:flex; justify-content:space-between; align-items:center; border:2px dashed #333; padding:10px; margin:5px 0; background-color:#e0e0e0; cursor:move;">
                    <div>
                        <b>{{ p.title }}</b><br>
                        <small>{{ p.idUtiisateur }}</small>
                    </div>
                    <form action="{{ url_for('delete_playlist', playlist_id=p.idPlaylist) }}" method="POST" style="display:inline;">
                        <button type="submit" style="background:none; border:none; cursor:pointer;">
                            <img src="{{ url_for('static', filename='img/delete.png') }}" style="width:20px;">
                        </button>
                    </form>
                </div>
                {% endfor %}
            </div>
            <div id="tab-all-music" class="panel-view"> <!--musique gauche, liste des musiques-->
                {% for m in musiques %}
                <div id="music-box-{{ m.idMusique }}" class="music-box" draggable="true" data-music-id="{{ m.idMusique }}">
                    <b>{{ m.nomMusique }}</b><br>
                    <small>Durée : {{ m.duree }}</small>
                    <form action="{{ url_for('delete_music', music_id=m.idMusique) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn-outline-blue"><img src="{{ url_for('static', filename='img/delete.png') }}" alt="Supprimer"></button>
                    </form>
                </div>
                {% endfor %}
            </div>
        </div>

        <div class="right-panel">

            <div id="upload-panel" class="panel-view">
                <form action="/upload" method="POST" enctype="multipart/form-data" id="upload-form">
                    <input type="hidden" name="playlist_id" id="playlist-id">

                    <label class="upload-area" id="upload-zone" for="audio-input">
                        <p id="upload-text">Glisser-déposer ou cliquer pour sélectionner un fichier</p>
                        <input
                            type="file"
                            name="audio"
                            id="audio-input"
                            accept=".mp3"
                            multiple 
                            required
                            style="display: none;"
                        >
                    </label>

                    <div id="file-preview-container" class="file-preview-container hidden"></div>

                    <div class="upload-actions">
                        <button type="submit" id="btn-upload" class="btn-action-blue full-width" disabled>
                            Ajouter à la base de données
                        </button>
                        <button type="button" class="btn-outline-blue">
                            <a href="https://notube.lol/fr" target="_blank">Convertir en MP3</a>
                        </button>
                    </div>
                </form>
            </div>

            <div id="playlist-side-panel" class="panel-view active">
            </div>

        </div>

    </main>

    <script> //in future, mets js dans fichier dédié voir 2 ca casse les couilles la


        // --- BOÎTES PLAYLIST & DRAG AND DROP ---
        // Une boîte par playlist(cf. boucle Jinja dans #tab-playlists).
        const playlistBoxes = document.querySelectorAll('#tab-playlists [draggable="true"]');
        playlistBoxes.forEach(box => {
            box.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', e.target.id);
            });
        });


        // --- SUPPRESSION DE PLAYLIST EN AJAX ---
        document.querySelectorAll('#tab-playlists .panel-view form').forEach(form => {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const box = form.closest('[draggable]');
                try {
                    const res = await fetch(form.action, {
                        method: 'POST',
                        headers: { 'X-Requested-With': 'XMLHttpRequest' }
                    });
                    if (res.ok) {
                        box.remove();
                    } else {
                        console.error('Erreur suppression playlist', res.status);
                    }
                } catch (err) {
                    console.error('Erreur réseau', err);
                }
            });
        });

        // --- BOÎTES MUSIQUE & DRAG AND DROP ---
        // Une boîte par musique (cf. boucle Jinja dans #tab-all-music).
        // Elles ne peuvent être lâchées que dans les zones désignées (.panel-view).
        const musicBoxes = document.querySelectorAll('.music-box');
        const dropzones = document.querySelectorAll('.panel-view');

        musicBoxes.forEach(box => {
            box.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', e.target.id);
            });
        });

        dropzones.forEach(zone => {
            // Nécessaire pour autoriser le drop (comportement par défaut l'empêche)
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                const boxId = e.dataTransfer.getData('text/plain');
                const draggedBox = document.getElementById(boxId);
                if (!draggedBox) return;

                // S'assure qu'on ajoute à la zone (.panel-view), pas à l'intérieur d'une autre boîte
                if (e.target.classList.contains('panel-view')) {
                    e.target.appendChild(draggedBox);
                } else {
                    const target = e.target.closest('.panel-view');
                    if (target) target.appendChild(draggedBox);
                }
            });
        });

        // --- SUPPRESSION DE MUSIQUE EN AJAX ---
        document.querySelectorAll('#tab-all-music .music-box form').forEach(form => {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const box = form.closest('.music-box');

                try {
                    const res = await fetch(form.action, {
                        method: 'POST',
                        headers: { 'X-Requested-With': 'XMLHttpRequest' }
                    });

                    if (res.ok) {
                        box.remove();
                    } else {
                        console.error('Erreur lors de la suppression', res.status);
                    }
                } catch (err) {
                    console.error('Erreur réseau lors de la suppression', err);
                }
            });
        });

        // Onglets Playlists / Toutes les musiques
        const uploadPanel = document.getElementById('upload-panel');
        const playlistSidePanel = document.getElementById('playlist-side-panel');

        document.querySelectorAll('.tab-pill').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-pill').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('#tab-playlists, #tab-all-music').forEach(v => v.classList.remove('active'));
                btn.classList.add('active');
                const targetId = btn.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');

                // Bascule le panneau droit en fonction de l'onglet actif
                uploadPanel.classList.remove('active');
                playlistSidePanel.classList.remove('active');
                if (targetId === 'tab-all-music') {
                    uploadPanel.classList.add('active');
                } else {
                    playlistSidePanel.classList.add('active');
                }
            });
        });

        const deleteImgUrl = "{{ url_for('static', filename='img/delete.png') }}";

        // --- GESTION DE L'UPLOAD DE FICHIERS (Preview & Suppression) ---
        const audioInput = document.getElementById('audio-input');
        const filePreviewContainer = document.getElementById('file-preview-container');
        const btnUpload = document.getElementById('btn-upload');
        const uploadText = document.getElementById('upload-text');
        
        // Objet magique pour manipuler les FileList en JavaScript
        let selectedFilesTransfer = new DataTransfer(); 

        if (audioInput) {
            audioInput.addEventListener('change', function() {
                // Ajoute les nouveaux fichiers sélectionnés à notre liste virtuelle
                for (let i = 0; i < this.files.length; i++) {
                    selectedFilesTransfer.items.add(this.files[i]);
                }
                // Met à jour le vrai input pour l'envoi Flask
                this.files = selectedFilesTransfer.files;
                updateFilePreview();
            });
        }

        function updateFilePreview() {
            filePreviewContainer.innerHTML = ''; // On vide l'affichage

            if (selectedFilesTransfer.files.length > 0) {
                filePreviewContainer.classList.remove('hidden');
                btnUpload.disabled = false; // Active le bouton d'envoi
                uploadText.innerText = "Ajouter d'autres fichiers (.mp3)";

                // Génère le HTML pour chaque fichier
                Array.from(selectedFilesTransfer.files).forEach((file, index) => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-preview-item';

                    const fileName = document.createElement('span');
                    fileName.className = 'item-name';
                    fileName.innerText = file.name;

                    const removeBtn = document.createElement('span');
                    removeBtn.className = 'remove-file-btn';
                    // On réutilise ton icône de poubelle
                    removeBtn.innerHTML = `<img src="${deleteImgUrl}" alt="Delete">`;
                    
                    removeBtn.addEventListener('click', function(e) {
                        e.preventDefault(); // Évite d'ouvrir l'explorateur de fichiers
                        removeFile(index);
                    });

                    fileItem.appendChild(fileName);
                    fileItem.appendChild(removeBtn);
                    filePreviewContainer.appendChild(fileItem);
                });
            } else {
                // S'il n'y a plus de fichiers, on cache tout
                filePreviewContainer.classList.add('hidden');
                btnUpload.disabled = true;
                uploadText.innerText = "Glisser-déposer ou cliquer pour sélectionner un fichier";
            }
        }

        function removeFile(indexToRemove) {
            const newTransfer = new DataTransfer();
            
            // On recrée la liste en ignorant le fichier supprimé
            Array.from(selectedFilesTransfer.files).forEach((file, index) => {
                if (index !== indexToRemove) {
                    newTransfer.items.add(file);
                }
            });
            
            selectedFilesTransfer = newTransfer;
            audioInput.files = selectedFilesTransfer.files; // Met à jour le vrai input
            updateFilePreview(); // Rafraîchit l'affichage
        }

        // --- UPLOAD EN AJAX (pas de rechargement de page) ---
        const uploadForm = document.getElementById('upload-form');
        const allMusicTab = document.getElementById('tab-all-music');

        if (uploadForm) {
            uploadForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const formData = new FormData(uploadForm);

                try {
                    const res = await fetch(uploadForm.action, {
                        method: 'POST',
                        headers: { 'X-Requested-With': 'XMLHttpRequest' },
                        body: formData
                    });

                    if (!res.ok) {
                        console.error('Erreur lors de l\'upload', res.status);
                        return;
                    }

                    const data = await res.json();

                    (data.musiques || []).forEach(m => {
                        const box = document.createElement('div');
                        box.id = `music-box-${m.idMusique}`;
                        box.className = 'music-box';
                        box.draggable = true;
                        box.dataset.musicId = m.idMusique;
                        box.innerHTML = `
                            <b>${m.nomMusique}</b><br>
                            <small>Durée : ${m.duree}</small>
                            <form action="/marketing/music/${m.idMusique}/delete" method="POST" style="display:inline;">
                                <button type="submit" class="btn-outline-blue"><img src="${deleteImgUrl}" alt="Supprimer"></button>
                            </form>
                        `;

                        // Réattache les écouteurs drag & delete sur la nouvelle boîte
                        box.addEventListener('dragstart', (ev) => {
                            ev.dataTransfer.setData('text/plain', ev.target.id);
                        });
                        box.querySelector('form').addEventListener('submit', async (ev) => {
                            ev.preventDefault();
                            const f = ev.target;
                            const b = f.closest('.music-box');
                            try {
                                const r = await fetch(f.action, {
                                    method: 'POST',
                                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                                });
                                if (r.ok) {
                                    b.remove();
                                } else {
                                    console.error('Erreur lors de la suppression', r.status);
                                }
                            } catch (err) {
                                console.error('Erreur réseau lors de la suppression', err);
                            }
                        });

                        allMusicTab.appendChild(box);
                    });

                    // Réinitialise le formulaire et la prévisualisation
                    selectedFilesTransfer = new DataTransfer();
                    audioInput.value = '';
                    updateFilePreview();

                } catch (err) {
                    console.error('Erreur réseau lors de l\'upload', err);
                }
            });
        }
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
