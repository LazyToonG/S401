<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musiquali - Marketing</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='style_marketing.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='message_alert.css') }}" rel="stylesheet">
    <style>
        .music-box {
            border: 2px dashed #651b1b;
            padding: 10px;
            margin: 5px 0;
            background-color: #EBE3E3;
            cursor: move;
            border-radius: 8px;
            color: #000;
        }
    </style>
</head>
<body class="no-scroll"> 
    {% include 'nav_bar.html' %}

    <div class="tabs-container">
        <button class="tab-pill active" data-target="tab-playlists">{{t.playlist}}</button>
        <button class="tab-pill" data-target="tab-all-music">{{t.musics}}</button>
    </div>

    <main class="marketing-layout">

        <div class="left-panel"> <!--liste des musiques, toujours visible-->
            {% for m in musiques %}
            <div id="music-box-{{ m.idMusique }}" class="music-box" draggable="true" data-music-id="{{ m.idMusique }}">
                <b>{{ m.nomMusique }}</b><br>
                <small>Durée : {{ m.duree }}</small>
                <form action="{{ url_for('delete_music', music_id=m.idMusique) }}" method="POST" style="display:inline;">
                    
                    <button type="submit" style="background:none; border:none; cursor:pointer;">
                                <img src="{{ url_for('static', filename='img/delete.png') }}" style="width:20px;">
                    </button>
                </form>
            </div>
            {% endfor %}
        </div>

        <div class="right-panel" style="position:relative;">

            <div id="tab-playlists" class="panel-view active"> <!--gestion des playlistes-->

                <form action="{{ url_for('add_playlist') }}" method="POST" style="display:flex; gap:8px; margin-bottom:10px;">
                    <input type="text" name="title" placeholder="Nom de la playlist" required>
                    <button type="submit">+ {{t.ajout_play}}</button>
                </form>
                {% for p in playlists %}
                <div id="playlist-box-{{ p.idPlaylist }}" draggable="true" data-playlist-id="{{ p.idPlaylist }}" style="display:flex; justify-content:space-between; align-items:center; border:2px dashed #333; padding:10px; margin:5px 0; background-color:#e0e0e0; cursor:move;">
                    <div>
                        <b>{{ p.title }}</b><br>
                        <small>{{ p.idUtilisateur }}</small>
                    </div>
                    <form action="{{ url_for('delete_playlist', playlist_id=p.idPlaylist) }}" method="POST" style="display:inline;">
                        <button type="submit" style="background:none; border:none; cursor:pointer;">
                            <img src="{{ url_for('static', filename='img/delete.png') }}" style="width:20px;">
                        </button>
                    </form>
                </div>
                {% endfor %}
            </div>
            <div id="tab-all-music" class="panel-view"> <!--musique gauche, liste des musiques-->
                {% for m in musiques %}
                <div id="music-box-{{ m.idMusique }}" class="music-box" draggable="true" data-music-id="{{ m.idMusique }}">
                    <b>{{ m.nomMusique }}</b><br>
                    <small>{{t.duree}} {{ m.duree }}</small>
                    <form action="{{ url_for('delete_music', music_id=m.idMusique) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn-outline-blue"><img src="{{ url_for('static', filename='img/delete.png') }}" alt="Supprimer"></button>
                    </form>
                </div>
                {% endfor %}


                <!--touche pas a cette zone-->
                <div id="playlistMusics" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgb(255,255,255); z-index:10; padding:20px; box-sizing:border-box; overflow-y:auto;">
                    <button onclick="toggleplaylistInfo()" style="position: absolute; top: 20px; right: 20px; background: none; border: 1px solid #333; padding: 5px 10px; cursor: pointer; border-radius: 4px;">Retour</button>
                    <h3 id="playlistTitle" style="color: #000; margin-top: 40px;"></h3>
                    <div id="playlistMusicsContent" style="color: #000;"></div>
                </div>
                <!--touche pas a cette zone, c pas fini-->

            </div>

            <div id="tab-all-music" class="panel-view"> <!--upload musiques-->
                <form action="/upload" method="POST" enctype="multipart/form-data" id="upload-form">
                    <input type="hidden" name="playlist_id" id="playlist-id">

                    <label class="upload-area" id="upload-zone" for="audio-input">
                        <p id="upload-text">{{t.h3}}</p>
                        <input
                            type="file"
                            name="audio"
                            id="audio-input"
                            accept=".mp3"
                            multiple 
                            required
                            style="display: none;"
                        >
                    </label>

                    <div id="file-preview-container" class="file-preview-container hidden"></div>

                    <div class="upload-actions">
                        <button type="submit" id="btn-upload" class="btn-action-blue full-width" disabled>
                            {{t.ajout_bd}}
                        </button>
                        <button type="button" class="btn-outline-blue">
                            <a href="https://notube.lol/fr" target="_blank">{{t.convertir}}</a>
                        </button>
                    </div>
                </form>
            </div>

        </div>

    </main>

    <script>
        const deleteImgUrl = "{{ url_for('static', filename='img/delete.png') }}";

        // ID de la playlist actuellement ouverte dans l'overlay (null si fermé)
        let currentPlaylistId = null;

        // =============================================================================
        // 1. FONCTIONS UTILITAIRES
        // =============================================================================

        // Attache drag + delete AJAX sur une music-box (utilisé au chargement ET après upload)
        function attachMusicBoxListeners(box) {
            // Drag
            box.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', e.target.id);
            });

            // Suppression de la musique en BD + retrait du DOM
            const form = box.querySelector('form');
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    try {
                        const res = await fetch(form.action, {
                            method: 'POST',
                            headers: { 'X-Requested-With': 'XMLHttpRequest' }
                        });
                        if (res.ok) {
                            box.remove();
                        } else {
                            console.error('Erreur suppression musique', res.status);
                        }
                    } catch (err) {
                        console.error('Erreur réseau suppression musique', err);
                    }
                });
            }
        }

        // Supprime une musique d'une playlist (appelé depuis l'overlay)
        async function removeMusicFromPlaylist(playlistId, musicId) {
            try {
                const res = await fetch(`/marketing/playlist/${playlistId}/remove_music/${musicId}`, {
                    method: 'POST',
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });
                if (res.ok) {
                    document.getElementById(`overlay-music-${musicId}`)?.remove();
                } else {
                    console.error('Erreur suppression relation', res.status);
                }
            } catch (err) {
                console.error('Erreur réseau suppression relation', err);
            }
        }

        // Ouvre/ferme l'overlay de composition d'une playlist
        async function toggleplaylistInfo(playlistId, playlistTitle) {
            const div = document.getElementById('playlistMusics');
            const titleEl = document.getElementById('playlistTitle');
            const contentEl = document.getElementById('playlistMusicsContent');

            // Ferme si déjà ouvert
            if (div.style.display !== 'none') {
                div.style.display = 'none';
                currentPlaylistId = null;
                return;
            }

            currentPlaylistId = playlistId;
            div.style.display = 'block';
            titleEl.textContent = `Musiques de : ${playlistTitle}`;
            contentEl.innerHTML = '<i>Chargement...</i>';

            try {
                const response = await fetch(`/marketing/playlist/${playlistId}/musiques`, {
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });
                const data = await response.json();

                if (!data || data.length === 0) {
                    contentEl.innerHTML = '<p><i>Aucune musique dans cette playlist.</i></p>';
                    return;
                }

                // Génère une ligne par musique avec bouton de retrait de la playlist
                contentEl.innerHTML = data.map(m =>
                    `<div id="overlay-music-${m.idMusique}" style="display:flex; justify-content:space-between; align-items:center; padding:8px; border-bottom:1px solid #eee;">
                        <span><b>${m.nomMusique}</b> — <small>${m.duree}s</small></span>
                        <button onclick="removeMusicFromPlaylist(${playlistId}, ${m.idMusique})" style="background:none; border:none; cursor:pointer;">
                            <img src="${deleteImgUrl}" style="width:16px;">
                        </button>
                    </div>`
                ).join('');

            } catch (err) {
                contentEl.innerHTML = '<p>Erreur de chargement</p>';
                console.error(err);
            }
        }


        // =============================================================================
        // 2. PLAYLISTS — drag, suppression
        // =============================================================================

        // Drag sur les boîtes playlist
        document.querySelectorAll('#tab-playlists [draggable="true"]').forEach(box => {
            box.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', e.target.id);
            });
        });

        // Suppression de playlist en AJAX
        document.querySelectorAll('#tab-playlists [draggable] form').forEach(form => {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const box = form.closest('[draggable]');
                try {
                    const res = await fetch(form.action, {
                        method: 'POST',
                        headers: { 'X-Requested-With': 'XMLHttpRequest' }
                    });
                    if (res.ok) {
                        box.remove();
                    } else {
                        console.error('Erreur suppression playlist', res.status);
                    }
                } catch (err) {
                    console.error('Erreur réseau suppression playlist', err);
                }
            });
        });


        // =============================================================================
        // 3. MUSIQUES — drag, suppression
        // =============================================================================

        // Attache les listeners sur toutes les music-box présentes au chargement
        document.querySelectorAll('.music-box').forEach(box => {
            attachMusicBoxListeners(box);
        });

        // Dropzones : uniquement le panneau gauche (.left-panel) accepte les drops de musique
        // Le panneau droit n'est PAS une dropzone pour les musiques
        const leftPanel = document.querySelector('.left-panel');
        leftPanel.addEventListener('dragover', (e) => e.preventDefault());
        leftPanel.addEventListener('drop', (e) => {
            e.preventDefault();
            const boxId = e.dataTransfer.getData('text/plain');
            const draggedBox = document.getElementById(boxId);
            // N'accepte que les music-box (pas les playlist-box)
            if (!draggedBox || !draggedBox.classList.contains('music-box')) return;
            leftPanel.appendChild(draggedBox);
        });


        // =============================================================================
        // 4. DROP MUSIQUE → PLAYLIST (crée la relation en BD)
        // =============================================================================

        // Chaque playlist-box est une dropzone secondaire.
        // Dropper une musique dessus persiste la relation mais garde la musique à gauche.
        document.querySelectorAll('#tab-playlists [draggable][data-playlist-id]').forEach(playlistBox => {
            playlistBox.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
            });

            playlistBox.addEventListener('drop', async (e) => {
                e.preventDefault();
                e.stopPropagation();

                const boxId = e.dataTransfer.getData('text/plain');
                const draggedBox = document.getElementById(boxId);
                if (!draggedBox) return;

                // Vérifie que c'est bien une music-box
                const musicId = draggedBox.dataset.musicId;
                if (!musicId) return;

                const playlistId = playlistBox.dataset.playlistId;

                try {
                    const res = await fetch(`/marketing/playlist/${playlistId}/add_music/${musicId}`, {
                        method: 'POST',
                        headers: { 'X-Requested-With': 'XMLHttpRequest' }
                    });
                    if (res.ok) {
                        // Feedback visuel bref sur la playlist box
                        playlistBox.style.outline = '2px solid green';
                        setTimeout(() => playlistBox.style.outline = '', 800);
                    } else {
                        console.error('Erreur ajout relation', res.status);
                    }
                } catch (err) {
                    console.error('Erreur réseau ajout relation', err);
                }
                // La music-box reste dans le panneau gauche, on ne la déplace pas
            });
        });

        // L'overlay #playlistMusics est aussi une dropzone :
        // dropper une musique dedans l'ajoute à la playlist actuellement ouverte
        const playlistMusicsOverlay = document.getElementById('playlistMusics');
        const playlistMusicsContent = document.getElementById('playlistMusicsContent');

        playlistMusicsOverlay.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
        });

        playlistMusicsOverlay.addEventListener('drop', async (e) => {
            e.preventDefault();
            e.stopPropagation();

            if (!currentPlaylistId) return;

            const boxId = e.dataTransfer.getData('text/plain');
            const draggedBox = document.getElementById(boxId);
            if (!draggedBox) return;

            const musicId = draggedBox.dataset.musicId;
            if (!musicId) return;

            const musicName = draggedBox.querySelector('b')?.textContent || '';
            const musicDuree = draggedBox.querySelector('small')?.textContent?.replace('Durée : ', '') || '';

            try {
                const res = await fetch(`/marketing/playlist/${currentPlaylistId}/add_music/${musicId}`, {
                    method: 'POST',
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });
                if (res.ok) {
                    // Ajoute la ligne dans l'overlay immédiatement
                    const emptyMsg = playlistMusicsContent.querySelector('p');
                    if (emptyMsg) emptyMsg.remove();

                    const row = document.createElement('div');
                    row.id = `overlay-music-${musicId}`;
                    row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:8px; border-bottom:1px solid #eee;';
                    row.innerHTML = `
                        <span><b>${musicName}</b> — <small>${musicDuree}</small></span>
                        <button onclick="removeMusicFromPlaylist(${currentPlaylistId}, ${musicId})" style="background:none; border:none; cursor:pointer;">
                            <img src="${deleteImgUrl}" style="width:16px;">
                        </button>
                    `;
                    playlistMusicsContent.appendChild(row);

                    // Feedback visuel sur l'overlay
                    playlistMusicsOverlay.style.outline = '2px solid green';
                    setTimeout(() => playlistMusicsOverlay.style.outline = '', 800);
                } else {
                    console.error('Erreur ajout relation via overlay', res.status);
                }
            } catch (err) {
                console.error('Erreur réseau ajout relation via overlay', err);
            }
        });


        // =============================================================================
        // 5. ONGLETS — bascule le panneau droit uniquement
        // =============================================================================

        document.querySelectorAll('.tab-pill').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-pill').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('#tab-playlists, #tab-all-music').forEach(v => v.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.getAttribute('data-target')).classList.add('active');
            });
        });


        // =============================================================================
        // 6. UPLOAD — preview fichiers + envoi AJAX
        // =============================================================================

        const audioInput = document.getElementById('audio-input');
        const filePreviewContainer = document.getElementById('file-preview-container');
        const btnUpload = document.getElementById('btn-upload');
        const uploadText = document.getElementById('upload-text');
        let selectedFilesTransfer = new DataTransfer();

        if (audioInput) {
            audioInput.addEventListener('change', function() {
                for (let i = 0; i < this.files.length; i++) {
                    selectedFilesTransfer.items.add(this.files[i]);
                }
                this.files = selectedFilesTransfer.files;
                updateFilePreview();
            });
        }

        function updateFilePreview() {
            filePreviewContainer.innerHTML = '';

            if (selectedFilesTransfer.files.length > 0) {
                filePreviewContainer.classList.remove('hidden');
                btnUpload.disabled = false;
                uploadText.innerText = "Ajouter d'autres fichiers (.mp3)";

                Array.from(selectedFilesTransfer.files).forEach((file, index) => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-preview-item';

                    const fileName = document.createElement('span');
                    fileName.className = 'item-name';
                    fileName.innerText = file.name;

                    const removeBtn = document.createElement('span');
                    removeBtn.className = 'remove-file-btn';
                    removeBtn.innerHTML = `<img src="${deleteImgUrl}" alt="Delete" style="width:16px;">`;
                    removeBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        removeFile(index);
                    });

                    fileItem.appendChild(fileName);
                    fileItem.appendChild(removeBtn);
                    filePreviewContainer.appendChild(fileItem);
                });
            } else {
                filePreviewContainer.classList.add('hidden');
                btnUpload.disabled = true;
                uploadText.innerText = "Glisser-déposer ou cliquer pour sélectionner un fichier";
            }
        }

        function removeFile(indexToRemove) {
            const newTransfer = new DataTransfer();
            Array.from(selectedFilesTransfer.files).forEach((file, index) => {
                if (index !== indexToRemove) newTransfer.items.add(file);
            });
            selectedFilesTransfer = newTransfer;
            audioInput.files = selectedFilesTransfer.files;
            updateFilePreview();
        }

        // Envoi de l'upload en AJAX — ajoute les nouvelles music-box dans le panneau gauche
        const uploadForm = document.getElementById('upload-form');

        if (uploadForm) {
            uploadForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(uploadForm);

                try {
                    const res = await fetch(uploadForm.action, {
                        method: 'POST',
                        headers: { 'X-Requested-With': 'XMLHttpRequest' },
                        body: formData
                    });

                    if (!res.ok) {
                        console.error('Erreur upload', res.status);
                        return;
                    }

                    const data = await res.json();

                    (data.musiques || []).forEach(m => {
                        const box = document.createElement('div');
                        box.id = `music-box-${m.idMusique}`;
                        box.className = 'music-box';
                        box.draggable = true;
                        box.dataset.musicId = m.idMusique;
                        box.innerHTML = `
                            <b>${m.nomMusique}</b><br>
                            <small>Durée : ${m.duree}</small>
                            <form action="/marketing/music/${m.idMusique}/delete" method="POST" style="display:inline;">
                                <button type="submit" style="background:none; border:none; cursor:pointer;">
                                    <img src="${deleteImgUrl}" alt="Supprimer" style="width:20px;">
                                </button>
                            </form>
                        `;
                        // Réutilise attachMusicBoxListeners pour drag + delete AJAX
                        attachMusicBoxListeners(box);
                        leftPanel.appendChild(box);
                    });

                    selectedFilesTransfer = new DataTransfer();
                    audioInput.value = '';
                    updateFilePreview();

                } catch (err) {
                    console.error('Erreur réseau upload', err);
                }
            });
        }
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
