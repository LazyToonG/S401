<html>
    <head>
        <meta charset="utf-8">
        <title>Site</title>
        <link rel="icon" href="../static/logo.png" type="image/png">
        <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
        <link href="{{ url_for('static', filename='style_accueil.css') }}" rel="stylesheet">

        <style>

        
        /* Conteneur global qui prend tout l'espace sous la navbar */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 93px); 
            width: 100%;
            box-sizing: border-box;
            padding: 20px;
        }

        /* Conteneur principal de la carte */
        .signup-card {
            background-color: #ffffff;
            color: #5d1b1b;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.193);
            position: relative;
            z-index: 1; 
            box-sizing: border-box;
        }

        /* Titre */
        .title {
            font-size: 28px;
            font-weight: normal;
            margin-bottom: 30px;
        }

        /* Groupes de champs de saisie */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .input-group input[type="text"],
        .input-group input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #5d1b1b5a;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            border-color: #5d1b1b;
        }



        /* Bouton d'inscription final */
        .submit-btn {
            width: 100%;
            background-color: #CE5956;
            color: #5d1b1b;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-family: inherit;
            border-radius: 25px; /* Bords plus arrondis comme sur l'image */
            cursor: pointer;
            margin-top: 0px;
            margin-bottom: 5px;
            transition: background-color 0.3s ease;
        }

        .submit-btn:hover {
            background-color: #91191d;
            color: white;
        }

        .page#signin {
            background-color: #a71e23;
            border-color: #a71e23;
        }
        
        .page:hover{
            background-color: #91191d !important;
        }
    </style>
    </head>
    <body>
    <div class="nav">
        <div class="logo"><img src="{{ url_for('static', filename='img/logo.png') }}" alt="logo"/><p>Musi-quali</p></div>
        <div class="b">
            <div class="page" id="signin">S'inscrire</div>
            <div class="page" id="index">Retour à l'accueil</div>
        </div>
    </div>
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="title">{{t.login}}</h1>
            <form action="#" method="POST">
                <div class="input-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="auth-submit-btn">{{t.login}}</button>
            </form>
        </div>
    </div>

        <script src="{{ url_for('static', filename='script.js') }}"></script>
        <script>
            document.getElementById('signin').addEventListener('click', function(){
                window.location.href = "/signin";
            })

            document.getElementById('index').addEventListener('click', function(){
                window.location.href = "/";
            })
        </script>
        <script src="{{ url_for('static', filename='script.js') }}"></script>

    </body>
</html>
